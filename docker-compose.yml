version: '3.8'
services:
  app:
    image: mintam141/miminiverse-app:latest
    build:
      context: .
      args:
        BUILD_VERSION: ${BUILD_VERSION:-latest}
    ports:
      - "3000:3000"
    restart: always
    environment:
      - BUILD_VERSION=c62d51895d5111aefff0a749290597e2cde9b8ff
    deploy:
      labels:
        - "com.centurylinklabs.watchtower.enable=true"