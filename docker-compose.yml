version: '3.8'
services:
  app:
    image: mintam141/miminiverse-app:latest
    build:
      context: .
      args:
        BUILD_VERSION: ${BUILD_VERSION:-latest}
    ports:
      - "3000:3000"
    restart: always
    environment:
      - BUILD_VERSION=2b8519bd588d209a9f09d8a169289f3cd3797c64
    deploy:
      labels:
        - "com.centurylinklabs.watchtower.enable=true"