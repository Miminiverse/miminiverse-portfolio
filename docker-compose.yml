version: '3.8'
services:
  app:
    image: mintam141/miminiverse-app:latest
    build:
      context: .
      args:
        BUILD_VERSION: ${BUILD_VERSION:-latest}
    ports:
      - "3000:3000"
    restart: always
    environment:
      - BUILD_VERSION=1f660565943e5d60d52bd4ac15ea4d28476faf80
    deploy:
      labels:
        - "com.centurylinklabs.watchtower.enable=true"